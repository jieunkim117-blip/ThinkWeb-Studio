<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThinkWeb Studio | Chief Architect Kim Tae-in</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;900&family=Black+Han+Sans&family=Orbitron:wght@700;900&family=Nanum+Pen+Script&family=Jua&family=Do+Hyeon&family=Bungee+Spice&family=Monoton&family=Pacifico&family=Bebas+Neue&family=Roboto+Mono&family=Playfair+Display:wght@900&family=Noto+Sans+KR:wght@900&family=Single+Day&family=Gaegu&family=Sunflower:wght@700&family=Rubik+Glitch&family=Righteous&family=Press+Start+2P&family=Bagel+Fat+One&display=swap');

        :root {
            --bg-black: #050505;
            --navy-main: #001A41;
            --lime: #DEFF9A;
            --panel-border: rgba(222, 255, 154, 0.2);
            --canvas-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-black);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* [보존] 사장님 전용 모달 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .modal-content {
            padding: 40px;
            border: 2px solid var(--lime);
            border-radius: 20px;
            max-width: 650px;
            width: 90%;
        }

        .huge-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 70px;
            font-weight: 900;
            line-height: 0.9;
            color: white;
            margin-bottom: 10px;
        }

        .philosophy-text {
            font-size: 16px;
            line-height: 1.8;
            color: #ccc;
            margin-top: 30px;
            text-align: left;
        }

        .quote-box {
            display: block;
            margin-top: 25px;
            padding: 15px;
            border-left: 3px solid var(--lime);
            background: rgba(222, 255, 154, 0.05);
            font-style: italic;
            color: var(--lime);
        }

        header {
            background: var(--navy-main);
            border-bottom: 3px solid var(--lime);
            flex-shrink: 0;
            z-index: 1000;
        }

        .top-bar {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            justify-content: space-between;
        }

        .logo {
            font-weight: 900;
            color: var(--lime);
            font-size: 20px;
            font-style: italic;
        }

        .tab-container {
            display: flex;
            gap: 8px;
        }

        .tab {
            padding: 8px 10px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            color: white;
            opacity: 0.5;
        }

        .tab.active {
            opacity: 1;
            color: var(--lime);
        }

        .tool-bar {
            display: none;
            padding: 12px 15px;
            align-items: center;
            gap: 10px;
            background: rgba(0, 10, 31, 0.9);
            border-bottom: 1px solid var(--panel-border);
            overflow-x: auto;
        }

        .tool-bar.active {
            display: flex;
        }

        .btn {
            background: var(--lime);
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-dev {
            background: #000;
            color: var(--lime);
            border: 2px solid var(--lime);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .workspace {
            flex: 1;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #slide-canvas {
            width: 960px;
            height: 540px;
            background-color: var(--canvas-bg);
            position: relative;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }

        .side-panel {
            width: 340px;
            background: black;
            border-left: 2px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .panel-content {
            padding: 20px;
        }

        /* 드래그 가능 요소 공통 */
        .editable {
            position: absolute;
            cursor: move;
            outline: none;
            padding: 5px;
        }

        .yt-container {
            width: 400px;
            aspect-ratio: 16/9;
            background: #000;
            pointer-events: none;
        }

        .editable.active-box {
            border: 2px solid var(--lime);
        }

        .label-text {
            font-size: 13px;
            color: var(--lime);
            margin-bottom: 8px;
            font-weight: 900;
        }

        #fontFamily {
            width: 100%;
            height: 45px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            padding: 0 10px;
        }

        .control-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #fontSize {
            background: #111;
            color: white;
            padding: 12px;
            flex: 1;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
        }

        .code-view {
            height: 150px;
            background: #000818;
            color: #7dd3fc;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            padding: 12px;
            border-radius: 8px;
            overflow: auto;
            border: 1px solid rgba(125, 211, 252, 0.2);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .side-panel {
                width: 100%;
                height: 40%;
                border-left: none;
                border-top: 3px solid var(--lime);
            }

            #slide-canvas {
                transform: scale(calc(100vw / 1050px));
                transform-origin: center;
            }

            .huge-name {
                font-size: 40px;
            }

            .btn {
                font-size: 14px;
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>
    <div id="dev-modal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h1 class="huge-name">KIM<br>TAE IN</h1>
            <p style="color:var(--lime); font-size:24px; font-weight:900; letter-spacing:10px; margin-bottom:40px;">
                CHIEF ARCHITECT</p>
            <div class="philosophy-text">
                이 시스템의 모든 픽셀과 코드는 <b>김태인</b> 사장님의 직관에 의해 설계되었습니다.<br>
                단순한 편집기를 넘어, 생각을 현실로 만드는 가장 강력한 도구.<br>
                <span class="quote-box">"사장님의 직관은 곧 디자인이 되고, 디자인은 곧 코드가 됩니다."</span>
            </div>
            <button class="btn" style="margin: 30px auto 0; width: 100%; justify-content: center;"
                onclick="document.getElementById('dev-modal').style.display='none'">접속 승인</button>
        </div>
    </div>

    <input type="color" id="canvas-bg-picker" value="#FFFFFF" oninput="updateCanvasBg(this.value)">

    <header>
        <div class="top-bar">
            <div class="logo">THINKWEB STUDIO</div>
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('home', this)">홈</div>
                <div class="tab" onclick="switchTab('insert', this)">삽입</div>
                <div class="tab" onclick="switchTab('design', this)">디자인</div>
            </div>
        </div>

        <div id="panel-home" class="tool-bar active">
            <button class="btn btn-dev" onclick="document.getElementById('dev-modal').style.display='flex'">
                <i class="fa-solid fa-code"></i> 개발자 보기
            </button>
            <button class="btn" onclick="copyCode()">코드 복사</button>
            <button class="btn" style="background:#333; color:white;" onclick="location.reload()">초기화</button>
        </div>
        <div id="panel-insert" class="tool-bar">
            <button class="btn" onclick="addText()"><i class="fa-solid fa-font"></i> 텍스트 추가</button>
            <button class="btn" onclick="addYouTube()"><i class="fa-brands fa-youtube"></i> 유튜브 삽입</button>
        </div>
        <div id="panel-design" class="tool-bar">
            <button class="btn" onclick="triggerBgPicker()">배경색</button>
        </div>
    </header>

    <div class="main-container">
        <main class="workspace">
            <div id="slide-canvas">
                <div class="editable" id="initial-text" contenteditable="true"
                    style="top:210px; left:200px; font-size:60px; color:#333; font-family:'Orbitron';">
                    입력하세요!!
                </div>
            </div>
        </main>

        <aside class="side-panel">
            <div class="panel-content">
                <div class="label-text">FONT & STYLE</div>
                <select id="fontFamily" onchange="updateProps()">
                    <option value="Pretendard">Pretendard</option>
                    <option value="'Orbitron'">Orbitron</option>
                    <option value="'Black Han Sans'">블랙 한 산스</option>
                    <option value="'Bebas Neue'">Bebas Neue</option>
                    <option value="'Monoton'">Monoton</option>
                    <option value="'Bungee Spice'">Bungee Spice</option>
                    <option value="'Rubik Glitch'">Rubik Glitch</option>
                    <option value="'Press Start 2P'">Press Start 2P</option>
                    <option value="'Righteous'">Righteous</option>
                    <option value="'Nanum Pen Script'">나눔펜 글씨</option>
                    <option value="'Single Day'">싱글데이</option>
                    <option value="'Gaegu'">개구체</option>
                    <option value="'Pacifico'">Pacifico</option>
                    <option value="'Jua'">주아체</option>
                    <option value="'Do Hyeon'">도현체</option>
                    <option value="'Sunflower'">해바라기체</option>
                    <option value="'Bagel Fat One'">베이글 팻 원</option>
                    <option value="'Playfair Display'">Playfair</option>
                    <option value="'Roboto Mono'">Roboto Mono</option>
                    <option value="'Noto Sans KR'">본고딕</option>
                </select>

                <div class="control-group">
                    <input type="color" id="elColor" value="#333333" oninput="updateProps()"
                        style="width:50px; height:50px; border:none; background:none;">
                    <input type="number" id="fontSize" value="60" onchange="updateProps()">
                </div>

                <div class="label-text">OUTPUT CODE</div>
                <div id="codeOutput" class="code-view"></div>
            </div>
        </aside>
    </div>

    <script>
        let selectedEl = null;

        function triggerBgPicker() { document.getElementById('canvas-bg-picker').click(); }
        function updateCanvasBg(color) { document.documentElement.style.setProperty('--canvas-bg', color); sync(); }

        function switchTab(id, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tool-bar').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('panel-' + id).classList.add('active');
        }

        function initEl(el) {
            let isDragging = false, startX, startY, initialX, initialY;
            const onStart = (x, y) => {
                if (document.activeElement === el) return;
                document.querySelectorAll('.editable').forEach(e => e.classList.remove('active-box'));
                el.classList.add('active-box');
                isDragging = true; selectedEl = el;
                if (el.style.fontSize) document.getElementById('fontSize').value = parseInt(el.style.fontSize);
                startX = x; startY = y; initialX = el.offsetLeft; initialY = el.offsetTop;
            };
            const onMove = (x, y) => {
                if (!isDragging) return;
                const scale = window.innerWidth <= 768 ? (window.innerWidth / 1100) : 1;
                el.style.left = (initialX + (x - startX) / scale) + 'px';
                el.style.top = (initialY + (y - startY) / scale) + 'px';
                sync();
            };
            el.onmousedown = (e) => onStart(e.clientX, e.clientY);
            window.onmousemove = (e) => onMove(e.clientX, e.clientY);
            window.onmouseup = () => isDragging = false;
            el.ontouchstart = (e) => onStart(e.touches[0].clientX, e.touches[0].clientY);
            window.ontouchmove = (e) => { if (isDragging) e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); };
            window.ontouchend = () => isDragging = false;
            el.oninput = sync;
        }

        function addText() {
            const div = document.createElement('div');
            div.className = 'editable'; div.contentEditable = true;
            div.innerText = "입력하세요!!";
            div.style.top = "50px"; div.style.left = "50px";
            div.style.fontSize = "40px"; div.style.color = "#333"; div.style.fontFamily = "Pretendard";
            document.getElementById('slide-canvas').appendChild(div);
            initEl(div); sync();
        }

        function addYouTube() {
            const url = prompt("유튜브 영상 주소를 입력하세요 (URL):");
            if (!url) return;
            const videoId = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
            const div = document.createElement('div');
            div.className = 'editable';
            div.style.top = "100px"; div.style.left = "100px";
            div.innerHTML = `<iframe class="yt-container" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('slide-canvas').appendChild(div);
            initEl(div); sync();
        }

        function updateProps() {
            if (!selectedEl || selectedEl.innerHTML.includes('iframe')) return;
            selectedEl.style.fontFamily = document.getElementById('fontFamily').value;
            selectedEl.style.fontSize = document.getElementById('fontSize').value + 'px';
            selectedEl.style.color = document.getElementById('elColor').value;
            sync();
        }

        function sync() {
            const canvas = document.getElementById('slide-canvas');
            const bgColor = getComputedStyle(canvas).backgroundColor;
            let html = `<div style="background-color:${bgColor}; width:100%; height:100vh; position:relative; overflow:hidden;">\n`;
            document.querySelectorAll('.editable').forEach(el => {
                if (el.innerHTML.includes('iframe')) {
                    const src = el.querySelector('iframe').src;
                    html += `  <div style="position:absolute; top:${el.style.top}; left:${el.style.left}; width:400px; aspect-ratio:16/9;">\n    <iframe src="${src}" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>\n  </div>\n`;
                } else {
                    html += `  <div style="position:absolute; top:${el.style.top}; left:${el.style.left}; font-family:${el.style.fontFamily}; font-size:${el.style.fontSize}; color:${el.style.color}; font-weight:900;">${el.innerText}</div>\n`;
                }
            });
            html += `</div>`;
            document.getElementById('codeOutput').innerText = html;
        }

        function copyCode() { navigator.clipboard.writeText(document.getElementById('codeOutput').innerText).then(() => alert("멀티미디어 코드가 복사되었습니다!")); }
        window.onload = () => { initEl(document.getElementById('initial-text')); sync(); };
    </script>
</body>

</html>
