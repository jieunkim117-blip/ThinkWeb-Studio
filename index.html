<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThinkWeb Studio | Architect Kim Tae-in</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&family=Black+Han+Sans&family=JetBrains+Mono&display=swap');

        :root {
            --bg-black: #050505;
            --navy-main: #001A41;
            --lime: #DEFF9A;
            --text-default: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-default);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- [헤더/리본 메뉴 - 사장님 원본 스타일] --- */
        header {
            background: var(--navy-main);
            border-bottom: 1px solid rgba(222, 255, 154, 0.2);
            flex-shrink: 0;
            z-index: 100;
        }

        .top-bar {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.4);
            justify-content: space-between;
        }

        .logo {
            font-weight: 900;
            color: var(--lime);
            font-size: 20px;
            letter-spacing: -1px;
            font-style: italic;
        }

        .tab-container {
            display: flex;
            gap: 5px;
        }

        .tab {
            padding: 10px 18px;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.6;
            color: white;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }

        .tab.active {
            opacity: 1;
            border-bottom-color: var(--lime);
            color: var(--lime);
        }

        .dev-reveal-btn {
            background: transparent;
            color: var(--lime);
            border: 2px solid var(--lime);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 900;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(222, 255, 154, 0.2);
        }

        .dev-reveal-btn:hover {
            background: var(--lime);
            color: black;
            box-shadow: 0 0 30px rgba(222, 255, 154, 0.5);
            transform: scale(1.05);
        }

        .tool-bar {
            display: none;
            padding: 12px 24px;
            align-items: center;
            gap: 20px;
            background: rgba(0, 10, 31, 0.6);
            overflow-x: auto;
        }

        .tool-bar.active {
            display: flex;
        }

        .btn {
            background: var(--lime);
            color: black;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .btn-dark {
            background: #222;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- [메인 레이아웃] --- */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .navigator {
            width: 160px;
            background: #0a0a0a;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slide-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid var(--lime);
            border-radius: 4px;
        }

        .workspace {
            flex: 1;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 40px;
            position: relative;
        }

        #slide-canvas {
            width: 960px;
            height: 540px;
            background: black;
            position: relative;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 1);
            flex-shrink: 0;
        }

        .side-panel {
            width: 400px;
            background: black;
            border-left: 1px solid rgba(222, 255, 154, 0.1);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* --- [편집 개체 - 드래그 수정] --- */
        .editable {
            position: absolute;
            cursor: move;
            outline: none;
            touch-action: none;
            border: 1.5px solid transparent;
        }

        .editable:focus {
            border: 1.5px solid var(--lime);
        }

        /* --- [초대형 모달 복귀 버튼만 적용] --- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            text-align: center;
            max-width: 900px;
            padding: 40px;
        }

        .huge-name {
            font-size: 15vw;
            font-family: 'Black Han Sans', sans-serif;
            color: white;
            line-height: 0.85;
            margin-bottom: 20px;
            letter-spacing: -5px;
        }

        .btn-massive {
            background: var(--lime);
            color: black;
            border: none;
            padding: 30px 80px; 
            border-radius: 100px;
            font-size: 32px; /* 사장님 요청대로 크게 */
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 40px rgba(222, 255, 154, 0.3);
            margin-top: 50px;
        }

        .btn-massive:hover { transform: scale(1.1); }

        /* 기타 인스펙터 스타일 유지 */
        .panel-content { flex: 1; overflow-y: auto; padding: 25px; }
        .panel-title { font-size: 11px; color: var(--lime); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .panel-title::after { content: ''; flex: 1; height: 1px; background: rgba(222, 255, 154, 0.15); }
        .input-dark { background: #0c0c0c; border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 10px; border-radius: 6px; font-size: 12px; outline: none; flex: 1; }
        .color-picker { width: 45px; height: 38px; background: transparent; border: none; cursor: pointer; }
        .code-view { height: 250px; background: #000818; color: #7dd3fc; font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 20px; border-radius: 10px; overflow: auto; margin-top: 10px; white-space: pre; border: 1px solid rgba(125, 211, 252, 0.1); }
    </style>
</head>

<body>

    <header>
        <div class="top-bar">
            <div class="logo">THINKWEB</div>
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('home', this)">홈</div>
                <div class="tab" onclick="switchTab('insert', this)">삽입</div>
                <div class="tab" onclick="switchTab('design', this)">디자인</div>
            </div>
            <button class="dev-reveal-btn" onclick="openDevModal()">개발자 알아보기</button>
        </div>

        <div id="panel-home" class="tool-bar active">
            <button class="btn" onclick="copyCode()">전체 코드 복사</button>
            <button class="btn btn-dark" onclick="location.reload()">초기화</button>
        </div>

        <div id="panel-insert" class="tool-bar">
            <button class="btn btn-dark" onclick="addText()">텍스트 추가</button>
            <button class="btn btn-dark" onclick="addLine()">선 추가</button>
        </div>

        <div id="panel-design" class="tool-bar">
            <span style="font-size: 11px;">배경색:</span>
            <input type="color" id="bgColor" value="#000000" oninput="applyBg()" class="color-picker">
        </div>
    </header>

    <div class="main-container">
        <aside class="navigator">
            <div class="slide-thumb"></div>
        </aside>

        <main class="workspace">
            <div id="slide-canvas">
                <div class="editable text-obj" contenteditable="true"
                    style="top: 150px; left: 100px; font-size: 80px; font-weight: 900; color: white;">Architect Edition
                </div>
            </div>
        </main>

        <aside class="side-panel">
            <div class="panel-content">
                <div class="panel-title">Inspector</div>
                <div id="text-controls">
                    <div class="prop-row" style="display:flex; gap:10px;">
                        <select id="fontFamily" onchange="updateProps()" class="input-dark">
                            <option value="Pretendard">Pretendard</option>
                            <option value="'Black Han Sans'">블랙한산스</option>
                        </select>
                        <input type="color" id="elColor" value="#ffffff" oninput="updateProps()" class="color-picker">
                    </div>
                    <input type="number" id="fontSize" value="80" onchange="updateProps()" class="input-dark" style="width: 100%; margin-top: 10px;">
                </div>
                <div class="panel-title" style="margin-top: 40px;">Live Source</div>
                <div id="codeOutput" class="code-view"></div>
            </div>
        </aside>
    </div>

    <div id="dev-modal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h1 class="huge-name">KIM<br>TAE IN</h1>
            <p style="color:var(--lime); font-size:24px; font-weight:900; letter-spacing:10px;">CHIEF ARCHITECT</p>
            <button class="btn-massive" onclick="document.getElementById('dev-modal').style.display='none'">시스템으로 복귀</button>
        </div>
    </div>

    <script>
        let selectedEl = null;
        const canvas = document.getElementById('slide-canvas');

        function switchTab(id, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tool-bar').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('panel-' + id).classList.add('active');
        }

        // --- [텍스트 이동 버그 해결 핵심 로직] ---
        function initEl(el) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            const dragStart = (e) => {
                // 텍스트 편집 모드일 때는 드래그 방지 (사장님 원본 의도 유지)
                if (document.activeElement === el) return;
                
                isDragging = true;
                selectedEl = el;
                const t = e.type === 'touchstart' ? e.touches[0] : e;
                startX = t.clientX; startY = t.clientY;
                initialX = el.offsetLeft; initialY = el.offsetTop;

                document.addEventListener('mousemove', dragMove);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchend', dragEnd);
            };

            const dragMove = (e) => {
                if (!isDragging) return;
                const t = e.type === 'touchmove' ? e.touches[0] : e;
                el.style.left = (initialX + (t.clientX - startX)) + 'px';
                el.style.top = (initialY + (t.clientY - startY)) + 'px';
                sync();
            };

            const dragEnd = () => { isDragging = false; sync(); };

            el.addEventListener('mousedown', dragStart);
            el.addEventListener('touchstart', dragStart);
            el.addEventListener('input', sync);
            el.addEventListener('focus', () => { selectedEl = el; });
        }

        function addText() {
            const div = document.createElement('div');
            div.className = 'editable text-obj';
            div.contentEditable = true;
            div.innerText = "TEXT";
            div.style.top = "100px"; div.style.left = "100px";
            div.style.fontSize = "80px";
            div.style.color = "white";
            div.style.fontWeight = "900";
            canvas.appendChild(div);
            initEl(div);
            sync();
        }

        function addLine() {
            const div = document.createElement('div');
            div.className = 'editable line-obj';
            div.style.top = "200px"; div.style.left = "100px";
            div.style.width = "300px"; div.style.height = "5px";
            div.style.backgroundColor = "white";
            canvas.appendChild(div);
            initEl(div);
            sync();
        }

        function updateProps() {
            if (!selectedEl) return;
            selectedEl.style.fontFamily = document.getElementById('fontFamily').value;
            selectedEl.style.fontSize = document.getElementById('fontSize').value + 'px';
            selectedEl.style.color = document.getElementById('elColor').value;
            sync();
        }

        function applyBg() { canvas.style.backgroundColor = document.getElementById('bgColor').value; sync(); }

        function sync() {
            let html = `<div style="background:${canvas.style.backgroundColor || 'black'}; width:100%; height:100vh; position:relative; overflow:hidden;">\n`;
            document.querySelectorAll('#slide-canvas > .editable').forEach(el => {
                const s = el.style;
                html += `  <div style="position:absolute; top:${s.top}; left:${s.left}; font-family:${s.fontFamily}; font-size:${s.fontSize}; color:${s.color}; font-weight:900;">${el.innerText}</div>\n`;
            });
            html += `</div>`;
            document.getElementById('codeOutput').innerText = html;
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('codeOutput').innerText);
            alert("코드가 복사되었습니다!");
        }

        function openDevModal() { document.getElementById('dev-modal').style.display = 'flex'; }
        window.onload = () => { document.querySelectorAll('.editable').forEach(initEl); sync(); };
    </script>
</body>

</html>
